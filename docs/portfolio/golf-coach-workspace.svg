y="198" class="small muted">See the movement. Understand the pattern. Make your next rep count.</text><text x="260" y="229" class="small" text-decoration="underline">Multiple views or a longer recording? Analyze a session →</text><rect x="1250" y="142" width="140" height="43" rx="6" fill="#fcfcf8" stroke="#d7ded2"/><text x="1275" y="169" class="small muted">+ New swing</text><rect x="260" y="264" width="420" height="480" rx="10" fill="#fcfcf8" stroke="#e2e7df"/><text x="284" y="299" class="label muted">01 / YOUR SWING</text><text x="284" y="334" class="heading" font-size="25">Start with a clear view.</text><rect x="284" y="356" width="372" height="44" rx="6" fill="#edf1e7"/><rect x="288" y="360" width="178" height="36" rx="5" fill="#fff"/><text x="323" y="383" class="small">↑ Upload video</text><text x="505" y="383" class="small muted">◎ Record swing</text><rect x="284" y="419" width="372" height="137" rx="8" fill="#f5f7f0" stroke="#a9b99f" stroke-dasharray="5 5"/><text x="457" y="461" font-size="26">↑</text><text x="359" y="496" font-size="14">Choose a swing video</text><text x="356" y="523" class="small muted">or drag a recording here</text><text x="284" y="589" class="small">Camera perspective</text><rect x="284" y="602" width="372" height="43" rx="6" fill="#fff" stroke="#d7ded2"/><text x="298" y="628" class="small muted">Not sure yet</text><text x="632" y="628" class="small muted">⌄</text><text x="284" y="678" class="small muted">Fine-tune this analysis</text><text x="633" y="678" class="small">+</text><rect x="284" y="696" width="372" height="32" rx="6" fill="#b5c3b2"/><text x="414" y="717" class="small" fill="#fff">Analyze swing</text><rect x="702" y="264" width="688" height="480" rx="10" fill="#fcfcf8" stroke="#e2e7df"/><text x="728" y="299" class="label muted">02 / VIDEO REVIEW</text><text x="728" y="334" class="heading" font-size="25">See the whole movement.</text><rect x="728" y="357" width="636" height="340" rx="8" fill="#25392e"/><circle cx="1046" cy="490" r="30" fill="#d7e2c8" fill-opacity=".12"/><path d="m1038 476 23 14-23 14Z" fill="#d7e2c8"/><text x="951" y="552" style="fill:#e2e9da" font-size="15">Your swing will appear here</text><text x="895" y="580" style="fill:#aebfa7" class="small">Upload or record a video to begin your review.</text><text x="728" y="725" class="small muted">Timestamp-aligned pose overlays appear after analysis.</text><rect x="260" y="773" width="1130" height="159" rx="10" fill="#edf1e6"/><circle cx="309" cy="832" r="22" fill="#e0e8d7"/><path d="M304 846v-27l20 6-20 8" fill="none" stroke="#245541" stroke-width="2"/><text x="350" y="810" class="label muted">A LITTLE SETUP GOES A LONG WAY</text><text x="350" y="850" class="heading" font-size="28">One swing. One steady camera.</text><text x="350" y="881" class="small muted">Film a single swing, keep your whole body visible, and choose the</text><text x="350" y="903" class="small muted">camera perspective that matches your clip.</text><text x="1265" y="879" class="heading" font-size="70" style="fill:#c6d1bc">01</text><text x="260" y="971" class="small muted">ⓘ 2D video gives perspective-dependent estimates. Use consistent filming conditions to compare.</text><text x="260" y="1016" font-size="11" class="muted">PORTFOLIO PREVIEW · RECREATED FROM SOURCE · EMPTY WORKSPACE</text></svg>